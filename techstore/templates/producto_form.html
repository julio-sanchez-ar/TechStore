{% extends "base.html" %}
{% block contenido %}
<h2 class="mb-3">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h2>

<form method="post" class="card card-body shadow-sm" style="max-width: 600px">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input name="nombre" class="form-control" required value="{{ producto.nombre if producto }}">
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select">
                {% for t in ['Equipo', 'Licencia'] %}
                    <option {{ 'selected' if producto and producto.tipo == t }}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col mb-3">
            <label class="form-label">Categoría</label>
            <select name="id_categoria" class="form-select">
                {% for c in categorias %}
                    <option value="{{ c.id_categoria }}"
                        {{ 'selected' if producto and producto.id_categoria == c.id_categoria }}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Precio</label>
            <input name="precio" type="number" step="0.01" class="form-control" required
                   value="{{ producto.precio if producto }}">
        </div>
        <div class="col mb-3">
            <label class="form-label">Stock</label>
            <input name="stock" type="number" class="form-control" required
                   value="{{ producto.stock if producto else 0 }}">
        </div>
    </div>
    <div>
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('productos') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
