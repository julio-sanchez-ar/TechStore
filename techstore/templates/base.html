<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% if session.id_empleado %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">TechStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('productos') }}">Productos</a></li>
                <!-- Aquí irán: Clientes, Cotizaciones, Promociones, Reportes -->
            </ul>
            <span class="navbar-text text-white me-3">{{ session.nombre }} ({{ session.rol }})</span>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Salir</a>
        </div>
    </div>
</nav>
{% endif %}

<main class="container">
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ categoria }} alert-dismissible fade show">
            {{ mensaje }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}

    {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
